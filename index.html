<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Aplikasi POS penjualan rokok ke agen &amp; reseller: stok opname, konsinyasi, kas, dan komisi sales.">
<title>POS Rokok — Agen &amp; Reseller</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<!-- agar nyaman dipasang di layar utama iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="POS Rokok">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
</head>
<body>

<div class="app-shell">

  <!-- ===== Sidebar / Drawer ===== -->
  <aside class="sidebar" id="sidebar" aria-label="Menu utama">
    <div class="sidebar-head">
      <div class="brand">
        <div class="brand-logo"><img src="img/mark-putih.svg" alt="" width="24" height="24"></div>
        <div class="brand-text">
          <strong id="brandName">POS Rokok</strong>
          <small id="brandSub">Agen &amp; Reseller</small>
        </div>
      </div>
      <button class="icon-btn drawer-close" id="drawerClose" aria-label="Tutup menu">✕</button>
    </div>
    <nav class="nav" id="mainNav"><!-- diisi app.js --></nav>
    <div class="sidebar-foot">
      <div class="muted xs">data tersimpan di perangkat</div>
    </div>
  </aside>
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

  <!-- ===== Main ===== -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Buka menu">☰</button>
      <div class="topbar-title">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub" class="muted xs"></p>
      </div>
      <span class="pil-sinkron" id="pilSinkron" hidden></span>
      <span class="pil-luring" id="pilLuring" hidden
            title="Tidak ada internet. Aplikasi tetap berjalan penuh — semua data tersimpan di perangkat ini.">Luring</span>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <main class="content" id="view" tabindex="-1"><!-- diisi router --></main>

    <!-- ===== Bottom nav (mobile) ===== -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi cepat"><!-- diisi app.js --></nav>
  </div>
</div>

<!-- ===== Overlay: modal, toast, sheet ===== -->
<div class="modal-root" id="modalRoot" hidden></div>
<div class="toast-root" id="toastRoot" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
<noscript><p style="padding:24px">Aplikasi ini membutuhkan JavaScript aktif.</p></noscript>
</body>
</html>
